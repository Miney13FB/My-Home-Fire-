name: build
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Crear proyecto
        run: |
          set -e
          mkdir -p proj/app/src/main/java/dev/homeredirect proj/app/src/main/res/xml proj/app/src/main/res/values
          cd proj

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "HomeRedirect"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=false
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'dev.homeredirect'
              compileSdk 34
              defaultConfig {
                  applicationId 'dev.homeredirect'
                  minSdk 21
                  targetSdk 34
                  versionCode 3
                  versionName '1.2'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.WRITE_SECURE_SETTINGS" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>
              <application
                  android:label="@string/app_name"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:banner="@android:drawable/sym_def_app_icon"
                  android:allowBackup="false">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".HomeService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Home Redirect</string>
              <string name="service_desc">Redirige el botón Home a tu launcher. No lee el contenido de la pantalla.</string>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="0"
              android:canRetrieveWindowContent="false"
              android:description="@string/service_desc" />
          EOF

          cat > app/src/main/java/dev/homeredirect/BootReceiver.java <<'EOF'
          package dev.homeredirect;
          
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          
          public class BootReceiver extends BroadcastReceiver {
              @Override public void onReceive(Context c, Intent i) {
                  SharedPreferences s = HomeService.sp(c);
                  if (!s.getBoolean("boot", false)) return;
                  Intent l = HomeService.launchIntent(c, s.getString("target", null));
                  if (l == null) return;
                  try { c.startActivity(l); } catch (Exception ignored) { }
              }
          }
          EOF

          cat > app/src/main/java/dev/homeredirect/HomeService.java <<'EOF'
          package dev.homeredirect;
          
          import android.accessibilityservice.AccessibilityService;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.PixelFormat;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.WindowManager;
          import android.view.accessibility.AccessibilityEvent;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          
          /**
           * Cuando el launcher de Amazon pasa a primer plano viniendo de otra app (= pulsaste Home),
           * abre el launcher elegido. No lee el contenido de la pantalla.
           */
          public class HomeService extends AccessibilityService {
              static final String AMAZON = "com.amazon.tv.launcher";
              private static final long COVER_MAX_MS = 8000;
          
              static volatile HomeService instance;
              static volatile String lastInfo;
          
              private final Handler h = new Handler(Looper.getMainLooper());
              private final Runnable hideCover = this::removeCover;
              private String target;
              private Intent launch;
              private boolean redirect = true;
              private String fg;
              private LinearLayout cover;
          
              static SharedPreferences sp(Context c) {
                  return c.getSharedPreferences("p", Context.MODE_PRIVATE);
              }
          
              static Intent launchIntent(Context c, String pkg) {
                  if (pkg == null) return null;
                  PackageManager pm = c.getPackageManager();
                  Intent i = pm.getLeanbackLaunchIntentForPackage(pkg);
                  if (i == null) i = pm.getLaunchIntentForPackage(pkg);
                  if (i != null) {
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK
                              | Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED
                              | Intent.FLAG_ACTIVITY_NO_ANIMATION);
                  }
                  return i;
              }
          
              static void refresh() {
                  HomeService s = instance;
                  if (s != null) s.reload();
              }
          
              @Override protected void onServiceConnected() {
                  instance = this;
                  reload();
              }
          
              private void reload() {
                  SharedPreferences s = sp(this);
                  target = s.getString("target", null);
                  redirect = s.getBoolean("redirect", true);
                  launch = launchIntent(this, target);   // se resuelve una sola vez
              }
          
              @Override public void onAccessibilityEvent(AccessibilityEvent e) {
                  CharSequence p = e.getPackageName();
                  if (p == null) return;
                  String pkg = p.toString();
          
                  if (pkg.equals(target)) {              // el destino ya apareció
                      fg = pkg;
                      removeCover();
                      return;
                  }
          
                  CharSequence c = e.getClassName();
                  String cls = c == null ? "" : c.toString();
                  if (cls.startsWith("android.") || cls.startsWith("androidx.")
                          || pkg.equals("com.android.systemui") || pkg.equals("android")) return;
          
                  boolean enteredAmazon = pkg.equals(AMAZON) && !AMAZON.equals(fg);
                  fg = pkg;
                  if (!enteredAmazon || launch == null || !redirect) return;
          
                  lastInfo = cls;
                  showCover();
                  try {
                      startActivity(launch);
                  } catch (Exception ex) {
                      removeCover();
                      reload();
                  }
              }
          
              /** Pantalla de carga solo en Fire OS 7 (API < 30). */
              private void showCover() {
                  if (Build.VERSION.SDK_INT >= 30 || cover != null) return;
                  try {
                      LinearLayout box = new LinearLayout(this);
                      box.setOrientation(LinearLayout.VERTICAL);
                      box.setGravity(Gravity.CENTER);
                      box.setBackgroundColor(0xFF1B1D22);
                      box.addView(new ProgressBar(this), new LinearLayout.LayoutParams(120, 120));
          
                      TextView t = new TextView(this);
                      t.setText("Cargando...");
                      t.setTextColor(0xFFFFFFFF);
                      t.setTextSize(24);
                      t.setGravity(Gravity.CENTER_HORIZONTAL);
                      t.setPadding(0, 32, 0, 0);
                      box.addView(t);
          
                      WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                              WindowManager.LayoutParams.MATCH_PARENT,
                              WindowManager.LayoutParams.MATCH_PARENT,
                              WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                      | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                                      | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                              PixelFormat.OPAQUE);
                      ((WindowManager) getSystemService(WINDOW_SERVICE)).addView(box, lp);
                      cover = box;
                      h.postDelayed(hideCover, COVER_MAX_MS);
                  } catch (Exception ignored) { cover = null; }
              }
          
              private void removeCover() {
                  h.removeCallbacks(hideCover);
                  if (cover == null) return;
                  try { ((WindowManager) getSystemService(WINDOW_SERVICE)).removeView(cover); }
                  catch (Exception ignored) { }
                  cover = null;
              }
          
              @Override public void onInterrupt() { }
          
              @Override public void onDestroy() {
                  removeCover();
                  if (instance == this) instance = null;
                  super.onDestroy();
              }
          }
          EOF

          cat > app/src/main/java/dev/homeredirect/MainActivity.java <<'EOF'
          package dev.homeredirect;
          
          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.CheckBox;
          import android.widget.LinearLayout;
          import android.widget.ListView;
          import android.widget.TextView;
          import android.widget.Toast;
          
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Set;
          
          public class MainActivity extends Activity {
              private TextView status;
              private ArrayAdapter<String> adapter;
              private final List<ResolveInfo> apps = new ArrayList<>();
              private final List<String> names = new ArrayList<>();
              private final List<String> labels = new ArrayList<>();
          
              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  PackageManager pm = getPackageManager();
          
                  Set<String> seen = new HashSet<>();
                  for (String cat : new String[]{Intent.CATEGORY_LEANBACK_LAUNCHER, Intent.CATEGORY_LAUNCHER}) {
                      Intent q = new Intent(Intent.ACTION_MAIN).addCategory(cat);
                      for (ResolveInfo ri : pm.queryIntentActivities(q, 0)) {
                          String pk = ri.activityInfo.packageName;
                          if (!pk.equals(getPackageName()) && seen.add(pk)) apps.add(ri);
                      }
                  }
                  Collections.sort(apps, (x, y) ->
                          x.loadLabel(pm).toString().compareToIgnoreCase(y.loadLabel(pm).toString()));
                  for (ResolveInfo ri : apps) {
                      names.add(ri.loadLabel(pm).toString());
                      labels.add("");
                  }
          
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(48, 32, 48, 32);
          
                  status = new TextView(this);
                  status.setTextSize(18);
                  root.addView(status);
          
                  Button enable = new Button(this);
                  enable.setText("Activar servicio");
                  enable.setOnClickListener(v -> enableService());
                  root.addView(enable);
          
                  root.addView(check("Redirigir el botón Home", "redirect", true));
                  root.addView(check("Abrir mi launcher al encender", "boot", false));
          
                  TextView hint = new TextView(this);
                  hint.setText("Elige tu launcher:");
                  hint.setTextSize(16);
                  root.addView(hint);
          
                  adapter = new ArrayAdapter<>(this, android.R.layout.simple_list_item_1, labels);
                  ListView list = new ListView(this);
                  list.setAdapter(adapter);
                  list.setOnItemClickListener((parent, v, pos, id) -> {
                      HomeService.sp(this).edit()
                              .putString("target", apps.get(pos).activityInfo.packageName).apply();
                      HomeService.refresh();
                      refreshStatus();
                  });
                  root.addView(list, new LinearLayout.LayoutParams(-1, 0, 1f));
                  setContentView(root);
              }
          
              @Override protected void onResume() { super.onResume(); refreshStatus(); }
          
              private CheckBox check(String text, String key, boolean def) {
                  CheckBox cb = new CheckBox(this);
                  cb.setText(text);
                  cb.setChecked(HomeService.sp(this).getBoolean(key, def));
                  cb.setOnCheckedChangeListener((v, on) -> {
                      HomeService.sp(this).edit().putBoolean(key, on).apply();
                      HomeService.refresh();
                  });
                  return cb;
              }
          
              private boolean serviceOn() {
                  String s = Settings.Secure.getString(getContentResolver(),
                          Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                  ComponentName cn = new ComponentName(this, HomeService.class);
                  return s != null && (s.contains(cn.flattenToString()) || s.contains(cn.flattenToShortString()));
              }
          
              private void refreshStatus() {
                  SharedPreferences s = HomeService.sp(this);
                  String t = s.getString("target", null);
                  String name = "(sin elegir)";
                  for (int i = 0; i < apps.size(); i++) {
                      boolean sel = apps.get(i).activityInfo.packageName.equals(t);
                      labels.set(i, sel ? "✓  " + names.get(i) : names.get(i));
                      if (sel) name = names.get(i);
                  }
                  adapter.notifyDataSetChanged();
                  String li = HomeService.lastInfo;
                  status.setText("Servicio: " + (serviceOn() ? "ACTIVO" : "apagado")
                          + "\nDestino: " + name
                          + "\nÚltimo Home detectado: " + (li == null ? "(ninguno aún)" : li));
              }
          
              private void enableService() {
                  try {
                      String flat = new ComponentName(this, HomeService.class).flattenToString();
                      String cur = Settings.Secure.getString(getContentResolver(),
                              Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                      if (cur == null) cur = "";
                      if (!cur.contains(flat)) cur = cur.isEmpty() ? flat : cur + ":" + flat;
                      Settings.Secure.putString(getContentResolver(),
                              Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES, cur);
                      Settings.Secure.putInt(getContentResolver(), Settings.Secure.ACCESSIBILITY_ENABLED, 1);
                      refreshStatus();
                  } catch (SecurityException e) {
                      Toast.makeText(this,
                              "Falta el permiso. En el shell escribe:\npm grant dev.homeredirect android.permission.WRITE_SECURE_SETTINGS",
                              Toast.LENGTH_LONG).show();
                  }
              }
          }
          EOF
      - name: Compilar
        run: |
          cd proj
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: home-redirect-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
