name: build
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Crear proyecto
        run: |
          set -e
          mkdir -p proj/app/src/main/java/dev/homeredirect proj/app/src/main/res/xml proj/app/src/main/res/values
          cd proj

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "HomeRedirect"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=false
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'dev.homeredirect'
              compileSdk 34
              defaultConfig {
                  applicationId 'dev.homeredirect'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.WRITE_SECURE_SETTINGS" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>
              <application
                  android:label="@string/app_name"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:banner="@android:drawable/sym_def_app_icon"
                  android:allowBackup="false">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".HomeService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Home Redirect</string>
              <string name="service_desc">Redirige el botón Home a tu launcher. No lee el contenido de la pantalla.</string>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="0"
              android:canRetrieveWindowContent="false"
              android:packageNames="com.amazon.tv.launcher"
              android:description="@string/service_desc" />
          EOF

          P=app/src/main/java/dev/homeredirect

          cat > $P/Prefs.java <<'EOF'
          package dev.homeredirect;

          import android.content.Context;
          import android.content.SharedPreferences;

          final class Prefs {
              private static SharedPreferences sp(Context c) {
                  return c.getSharedPreferences("p", Context.MODE_PRIVATE);
              }
              static String target(Context c) { return sp(c).getString("target", null); }
              static void setTarget(Context c, String pkg) { sp(c).edit().putString("target", pkg).apply(); }
              static boolean flag(Context c, String k, boolean d) { return sp(c).getBoolean(k, d); }
              static void setFlag(Context c, String k, boolean v) { sp(c).edit().putBoolean(k, v).apply(); }
          }
          EOF

          cat > $P/Launcher.java <<'EOF'
          package dev.homeredirect;

          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;

          final class Launcher {
              static boolean open(Context c, String pkg) {
                  if (pkg == null) return false;
                  PackageManager pm = c.getPackageManager();
                  Intent i = pm.getLeanbackLaunchIntentForPackage(pkg);
                  if (i == null) i = pm.getLaunchIntentForPackage(pkg);
                  if (i == null) return false;
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK
                          | Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED
                          | Intent.FLAG_ACTIVITY_NO_ANIMATION);
                  try { c.startActivity(i); return true; } catch (Exception e) { return false; }
              }
          }
          EOF

          cat > $P/BootReceiver.java <<'EOF'
          package dev.homeredirect;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class BootReceiver extends BroadcastReceiver {
              @Override public void onReceive(Context c, Intent i) {
                  if (Prefs.flag(c, "boot", false)) Launcher.open(c, Prefs.target(c));
              }
          }
          EOF

          cat > $P/HomeService.java <<'EOF'
          package dev.homeredirect;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.AccessibilityServiceInfo;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.SystemClock;
          import android.view.View;
          import android.view.WindowManager;
          import android.view.accessibility.AccessibilityEvent;

          public class HomeService extends AccessibilityService {
              static final String AMAZON = "com.amazon.tv.launcher";
              private static final long DOUBLE_PRESS_MS = 1500;
              private static final long COVER_MAX_MS = 6000;

              static HomeService instance;

              private final Handler h = new Handler(Looper.getMainLooper());
              private final Runnable hideCover = this::removeCover;
              private long lastRedirect;
              private View cover;

              @Override protected void onServiceConnected() {
                  instance = this;
                  refresh();
              }

              static void refresh() {
                  HomeService s = instance;
                  if (s == null) return;
                  String t = Prefs.target(s);
                  AccessibilityServiceInfo info = s.getServiceInfo();
                  if (info == null) return;
                  info.packageNames = (t == null) ? new String[]{AMAZON} : new String[]{AMAZON, t};
                  s.setServiceInfo(info);
              }

              @Override public void onAccessibilityEvent(AccessibilityEvent e) {
                  if (e.getEventType() != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED
                          || e.getPackageName() == null) return;
                  String pkg = e.getPackageName().toString();
                  String target = Prefs.target(this);
                  if (target == null) return;

                  if (pkg.equals(target)) { removeCover(); return; }
                  if (!pkg.equals(AMAZON) || !Prefs.flag(this, "redirect", true)) return;

                  long now = SystemClock.uptimeMillis();
                  if (now - lastRedirect < DOUBLE_PRESS_MS) {
                      lastRedirect = 0;
                      removeCover();
                      return;
                  }
                  lastRedirect = now;
                  showCover();
                  if (!Launcher.open(this, target)) removeCover();
              }

              private void showCover() {
                  if (Build.VERSION.SDK_INT >= 30 || cover != null) return;
                  try {
                      WindowManager wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                      View v = new View(this);
                      v.setBackgroundColor(Color.BLACK);
                      WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                              WindowManager.LayoutParams.MATCH_PARENT,
                              WindowManager.LayoutParams.MATCH_PARENT,
                              WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                      | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                                      | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                              PixelFormat.OPAQUE);
                      wm.addView(v, lp);
                      cover = v;
                      h.postDelayed(hideCover, COVER_MAX_MS);
                  } catch (Exception ignored) { cover = null; }
              }

              private void removeCover() {
                  h.removeCallbacks(hideCover);
                  if (cover == null) return;
                  try { ((WindowManager) getSystemService(WINDOW_SERVICE)).removeView(cover); }
                  catch (Exception ignored) { }
                  cover = null;
              }

              @Override public void onInterrupt() { }

              @Override public void onDestroy() {
                  removeCover();
                  if (instance == this) instance = null;
                  super.onDestroy();
              }
          }
          EOF

          cat > $P/MainActivity.java <<'EOF'
          package dev.homeredirect;

          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.CheckBox;
          import android.widget.LinearLayout;
          import android.widget.ListView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Set;

          public class MainActivity extends Activity {
              private static final String ADB_CMD =
                      "adb shell pm grant dev.homeredirect android.permission.WRITE_SECURE_SETTINGS";
              private TextView status;
              private final List<ResolveInfo> apps = new ArrayList<>();

              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  PackageManager pm = getPackageManager();

                  Set<String> seen = new HashSet<>();
                  for (String cat : new String[]{Intent.CATEGORY_LEANBACK_LAUNCHER, Intent.CATEGORY_LAUNCHER}) {
                      Intent q = new Intent(Intent.ACTION_MAIN).addCategory(cat);
                      for (ResolveInfo ri : pm.queryIntentActivities(q, 0)) {
                          String p = ri.activityInfo.packageName;
                          if (!p.equals(getPackageName()) && seen.add(p)) apps.add(ri);
                      }
                  }
                  Collections.sort(apps, (a, c) ->
                          a.loadLabel(pm).toString().compareToIgnoreCase(c.loadLabel(pm).toString()));
                  List<String> labels = new ArrayList<>();
                  for (ResolveInfo ri : apps) labels.add(ri.loadLabel(pm).toString());

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(48, 32, 48, 32);

                  status = new TextView(this);
                  status.setTextSize(18);
                  root.addView(status);

                  Button enable = new Button(this);
                  enable.setText("Activar servicio");
                  enable.setOnClickListener(v -> enableService());
                  root.addView(enable);

                  root.addView(check("Redirigir el botón Home", "redirect", true));
                  root.addView(check("Abrir mi launcher al encender", "boot", false));

                  TextView hint = new TextView(this);
                  hint.setText("Elige tu launcher:");
                  hint.setTextSize(16);
                  root.addView(hint);

                  ListView list = new ListView(this);
                  list.setAdapter(new ArrayAdapter<>(this, android.R.layout.simple_list_item_1, labels));
                  list.setOnItemClickListener((p, v, pos, id) -> {
                      Prefs.setTarget(this, apps.get(pos).activityInfo.packageName);
                      HomeService.refresh();
                      refreshStatus();
                  });
                  root.addView(list, new LinearLayout.LayoutParams(-1, 0, 1f));
                  setContentView(root);
              }

              @Override protected void onResume() { super.onResume(); refreshStatus(); }

              private CheckBox check(String text, String key, boolean def) {
                  CheckBox c = new CheckBox(this);
                  c.setText(text);
                  c.setChecked(Prefs.flag(this, key, def));
                  c.setOnCheckedChangeListener((v, on) -> Prefs.setFlag(this, key, on));
                  return c;
              }

              private boolean serviceOn() {
                  String s = Settings.Secure.getString(getContentResolver(),
                          Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                  ComponentName cn = new ComponentName(this, HomeService.class);
                  return s != null && (s.contains(cn.flattenToString()) || s.contains(cn.flattenToShortString()));
              }

              private void refreshStatus() {
                  String t = Prefs.target(this);
                  status.setText("Servicio: " + (serviceOn() ? "ACTIVO" : "apagado")
                          + "\nDestino: " + (t == null ? "(sin elegir)" : t));
              }

              private void enableService() {
                  try {
                      String flat = new ComponentName(this, HomeService.class).flattenToString();
                      String cur = Settings.Secure.getString(getContentResolver(),
                              Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                      if (cur == null) cur = "";
                      if (!cur.contains(flat)) cur = cur.isEmpty() ? flat : cur + ":" + flat;
                      Settings.Secure.putString(getContentResolver(),
                              Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES, cur);
                      Settings.Secure.putInt(getContentResolver(), Settings.Secure.ACCESSIBILITY_ENABLED, 1);
                      refreshStatus();
                  } catch (SecurityException e) {
                      Toast.makeText(this, "Falta el permiso. Ejecuta en el PC:\n" + ADB_CMD,
                              Toast.LENGTH_LONG).show();
                      try { startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)); }
                      catch (Exception ignored) { }
                  }
              }
          }
          EOF
      - name: Compilar
        run: |
          cd proj
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: home-redirect-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
